[project]
name = "open-connectivity"
version = "0.1.0"
description = "Connectivity analysis of open BIDS EEG data (ds002680 go/no-go)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "mne-connectivity>=0.9.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pingouin>=0.7.0",
    "pymatreader>=1.3.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bids_conn"]
